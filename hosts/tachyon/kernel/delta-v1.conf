# tachyon kernel delta v1: minimal deviations from armbian stock
# (config/kernel/linux-rockchip64-current.config in the armbian-build
# flake input, rockchip64-6.18 branch config).
# Merged AFTER the stock fragment (kconfig: last assignment wins),
# then resolved with olddefconfig. Headless router, no wifi hardware.
#
# v1 changes (all else = stock):
# - DRM=n (headless; drops the whole DRM stack: SIMPLEDRM, ROCKCHIP,
#   VIRTIO_GPU, PANFROST/PANTHOR, LIMA, ~80 panel/bridge drivers...)
# - WIRELESS=n + WLAN=n (no wifi hw on NanoPi R3S LTS; drops
#   cfg80211/mac80211 and the whole drivers/net/wireless subtree.
#   NOTE: WIRELESS alone is NOT enough: `menuconfig WLAN` (default y)
#   does `select WIRELESS`, so WLAN must go too -- otherwise olddefconfig
#   silently re-enables the stack (this was also the cause of the
#   WIRELESS=y drift in the 6.12 custom build).
# - OVERLAY_FS=y (stock m; containers use overlayfs, builtin is safer)
# - HFS_FS/HFSPLUS_FS=n (stock m; a router needs no Apple filesystems)
# - ARCH_MMAP_RND pinning (NOT a deviation: stock fragment is a kconfig
#   FRAGMENT, it does not carry Kconfig-defaulted symbols. NixOS greps the
#   merged configfile for these two (config/sysctl.nix -> sysctl.d/
#   55-nixos-aslr-entropy.conf) and fails the build if absent. Values are
#   the arm64 Kconfig defaults, verified in our resolved 6.18.51 .config
#   (CONFIG_ARCH_MMAP_RND_BITS_MAX=33, COMPAT_MAX=16); making them explicit
#   changes nothing in the resolved config. Re-verify on major rebase.)

# CONFIG_DRM is not set
# CONFIG_WIRELESS is not set
# CONFIG_WLAN is not set
CONFIG_OVERLAY_FS=y
# CONFIG_HFS_FS is not set
# CONFIG_HFSPLUS_FS is not set
CONFIG_ARCH_MMAP_RND_BITS_MAX=33
CONFIG_ARCH_MMAP_RND_COMPAT_BITS_MAX=16
